# Name: Documentation site
# Purpose: Builds the browsable documentation with MkDocs Material.
# Usage: mkdocs build --strict; mkdocs serve
# Validation: mkdocs build --strict
# References: docs/index.md, docs/validation-checklist.md

site_name: ToolWright
site_description: Provider-neutral multi-agent development toolkit for OpenCode, GitHub Copilot, Claude, and GPT.
site_author: ToolWright contributors
repo_url: https://github.com/GabrielAlmeidaFlores/ToolWright
repo_name: GabrielAlmeidaFlores/ToolWright

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js

