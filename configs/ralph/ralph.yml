# Name: Ralph core configuration
# Purpose: Shared loop, backend, adapter, memory, task, and guardrail settings for the official hat collections.
# Usage: ralph run -c configs/ralph/ralph.yml -H configs/ralph/hats/<collection>.yml -p "<task>"
# Validation: ralph preflight -c configs/ralph/ralph.yml --format human; ralph run --dry-run -c configs/ralph/ralph.yml -H configs/ralph/hats/code-assist.yml -p "test"
# References: https://mikeyobrien.github.io/ralph-orchestrator/guide/configuration/
# Notes: checkpoint_interval is omitted because Ralph 2.10.1 does not implement it. If upstream enables it, the default value of 5 may create automatic checkpoints; verify upstream behavior before enabling it. See AGENTS.md Section 2B.

cli:
  backend: "opencode"
  prompt_mode: "arg"

adapters:
  default:
    timeout: 600
    enabled: true
  opencode:
    timeout: 900

event_loop:
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 40
  max_runtime_seconds: 14400
  idle_timeout_secs: 1800
  starting_event: "work.start"
  prompt_file: "PROMPT.md"

core:
  scratchpad:
    enabled: true
    path: .ralph/agent/scratchpad.md
  specs_dir: ".ralph/specs/"
  guardrails:
    - "Read AGENTS.md before changing code."
    - "Do not modify files outside the requested scope."
    - "Run the narrowest relevant tests before declaring success."
    - "Never commit secrets, credentials, or environment values."
    - "Do not claim a command passed unless it was executed."

memories:
  enabled: true
  inject: auto
  budget: 2000

tasks:
  enabled: true

features:
  parallel: false
  auto_merge: false
  preflight:
    enabled: true
    strict: false
    skip: []

hooks:
  enabled: false
