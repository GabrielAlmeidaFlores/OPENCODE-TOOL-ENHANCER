original_artifacts:
  - id: benchmark-harness
    local: "benchmarks/harness/run.sh, benchmarks/tasks/*.json"
    kind: "fixture"
    justification: "Project-specific measurement harness and fixtures; no maintained upstream provides these exact tasks. Not reusable agents/skills."
  - id: installation-and-validation
    local: "scripts/**, .github/workflows/**"
    kind: "glue"
    justification: "Repository-specific glue that composes documented OpenCode, Ralph, Serena, CodeGraph, and ast-grep commands. No upstream equivalent."
  - id: examples
    local: "examples/typescript/**, examples/csharp/**"
    kind: "fixture"
    justification: "Minimal fixtures used by the benchmark tasks; they contain deliberate defects. Not presented as reusable agents or skills."
  - id: opencode-config
    local: "configs/opencode/**"
    kind: "configuration-composition"
    justification: "Composes only documented OpenCode V2 options. Not an agent, skill, or command."
  - id: project-logo
    local: "assets/logo.svg, assets/logo-dark.svg, assets/logo-mark.svg"
    kind: "original-artwork"
    author: "OPENCODE-TOOL-ENHANCER contributors"
    justification: "Original project logo created at the repository owner's request. Not adapted from an upstream artifact."
  - id: ralph-isolated-runner
    local: "scripts/maintenance/run-ralph-isolated.sh"
    kind: "glue"
    author: "OPENCODE-TOOL-ENHANCER contributors"
    justification: "Isolated runner required because Ralph 2.10.1 auto-commits during landing; keeps the main checkout untouched and exports an unstaged patch."
  - id: cost-report
    local: "scripts/benchmarking/report_costs.py"
    kind: "glue"
    author: "OPENCODE-TOOL-ENHANCER contributors"
    justification: "Aggregates harness session artifacts into a Markdown cost report; no upstream equivalent."
  - id: repository-tests
    local: "tests/**, VERSION, Makefile"
    kind: "fixture"
    author: "OPENCODE-TOOL-ENHANCER contributors"
    justification: "Project-specific test suite, deliberately broken fixtures, and build entry points for the repository's own tooling. Fixtures are test inputs only and must never be installed, cataloged, or presented as reusable agents, skills, or commands."
  - id: ote-cli
    local: "packages/ote_cli/**"
    kind: "glue"
    author: "OPENCODE-TOOL-ENHANCER contributors"
    justification: "Repository-specific Python wrapper over the existing installer, validator, backup, and restore scripts. The command surface and installer UX were informed by weisser-dev/awesome-opencode (MIT) and DVNghiem/FlowDeck (MIT); the lock file concept follows juanmanueldaza/nerv (Apache-2.0). No upstream code was copied; the implementation is original and dependency-free."
  - id: project-documentation
    local: "docs/**"
    kind: "original-documentation"
    author: "OPENCODE-TOOL-ENHANCER contributors"
    justification: "Project analysis, decision records, and operating guides written for this repository. Documentation is not an agent, skill, command, hat, prompt, or template, and no upstream document is reproduced as an artifact."

