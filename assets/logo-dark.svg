      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="120" x2="240" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="112" height="112" rx="28" fill="url(#mark)"/>
  <rect x="25" y="25" width="110" height="110" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <path d="M48 46 L66 62 L48 78" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 78 H98" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
