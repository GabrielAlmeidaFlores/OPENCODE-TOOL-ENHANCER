# Name: Upstream drift check
# Purpose: Compares pinned provenance commits with remote HEAD on a schedule.
# Usage: python scripts/maintenance/check_upstream_drift.py
# Validation: YAML parse; runs weekly and on manual dispatch
# References: docs/release/README.md

name: upstream-drift

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    timeout-minutes: 10
    name: upstream drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml
      - name: Report pinned commits versus remote HEAD
        run: |
          set +e
          python scripts/maintenance/check_upstream_drift.py | tee drift.md
          status=${PIPESTATUS[0]}
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
