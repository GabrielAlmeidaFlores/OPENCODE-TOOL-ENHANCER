# Name: Tag-driven release
# Purpose: Builds and publishes the CLI wheel with checksums when a v* tag is pushed.
# Usage: gh release create
# Validation: YAML parse; runs on v* tags
# References: docs/release/README.md

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 20
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag and versions
        run: python scripts/release/check_version.py --tag "$GITHUB_REF_NAME"
      - name: Build wheel
        run: python -m pip wheel ./packages/toolwright_cli --no-deps --wheel-dir dist
      - name: Write checksums
        run: |
          cd dist
          sha256sum ./*.whl > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
